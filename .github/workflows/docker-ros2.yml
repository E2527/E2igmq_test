name: ROS 2 Docker

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  # 開発用イメージをビルドし、コンテナ内で colcon build / test を実行する
  amd64:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Build dev image
        run: docker compose build dev
      - name: colcon build & test
        run: docker compose run --rm build

  # STM32 側のコードを PC 用にビルドしてテストする(HAL の代わりの hal_stub を使う)
  firmware:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - name: Firmware host tests
        run: make -C firmware/stm32_can/test
      - name: Install ARM toolchain
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends gcc-arm-none-eabi libnewlib-arm-none-eabi
      - name: Build STM32F303K8 firmware
        run: |
          make -C firmware/motor_node_f303k8 -j4
          make -C firmware/motor_node_f303k8 LINK=uart APP=led -j4

  # Pi 向け(arm64)にビルド済みイメージが作れるか確認する
  arm64:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - name: Build runtime image (arm64)
        run: docker compose build runtime
