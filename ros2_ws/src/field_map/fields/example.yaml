# フィールドの形(例)。大会のフィールドが決まったら、このファイルを書き換えるか、新しいファイルを作る。
#
#   書き換えたら、保存するだけで反映される(field_map_node が 1 秒ごとに見ていて、地図を作り直す)
#   新しいファイルを作ったら: ros2 launch field_map field_map.launch.py field:=ファイルの名前(.yaml なし)
#
# 座標: x が前(図の右)、y が左(図の上)、単位は m。フィールドのまん中を (0, 0) にすると分かりやすい
#
#          y
#          ↑   ┌──────────────── 6 m ────────────────┐
#              │                                      │
#              │        [台]            ( 柱 )        │  4 m
#              │                                      │
#              └──────────────────────────────────────┘  → x
#
# ★ これは例(仮の形)。本物のフィールドの図面を見て書き直すこと

field:
  name: 例のフィールド
  resolution: 0.05          # 1 マスの大きさ [m]。小さいほど細かいが、重くなる
  x_range: [-3.0, 3.0]      # フィールドの x の範囲 [m]
  y_range: [-2.0, 2.0]      # フィールドの y の範囲 [m]
  border: 0.05              # まわりに付ける壁の厚さ [m](外の壁を自分で書くなら 0)

  # 高さ [m]。地図を「通れるか用(/map)」と「位置合わせ用(/lidar_map)」の 2 枚に分けるのに使う
  lidar_height: 0.20        # 2D LiDAR の高さ(複数あれば [0.2, 0.5])。書かなければ全部映るとみなす
  robot_height: 0.60        # ロボットの高さ。これより上にある物の下はくぐれる
  step_height: 0.01         # 乗り越えられる高さ。これ以下の物(テープなど)は通れる

# ふさがっている場所(壁・台・柱など)。通れる物(床のテープ、低い段差)は書かないか passable: true
#   box     … 箱。中心 x, y と、大きさ size_x, size_y [m]。yaw_deg で回せる(反時計回りが正)
#   circle  … 円。中心 x, y と半径 radius [m]
#   polygon … 多角形。角を points: [[x, y], ...] の順に書く
# 高さ(どの図形にも書ける。書かなければ床から天井まで):
#   height: 0.3             … 床から 0.3 m の高さの物
#   z_min: 0.7, z_max: 0.9  … 浮いている物(棚の板など)。下の高さと上の高さ
shapes:
  - {type: box, name: 台, x: -1.2, y: 0.5, size_x: 0.6, size_y: 0.4, height: 0.5}
  - {type: box, name: 低いボックス, x: -0.2, y: 1.2, size_x: 0.4, size_y: 0.3, height: 0.10}
  - {type: box, name: 斜めの板, x: 0.0, y: -1.0, size_x: 1.0, size_y: 0.02, yaw_deg: 30, height: 0.3}
  - {type: circle, name: 柱, x: 1.5, y: 0.6, radius: 0.15}
  - {type: box, name: 上の棚, x: 0.9, y: -0.2, size_x: 0.5, size_y: 0.5, z_min: 0.7, z_max: 0.75}
  - {type: polygon, name: 三角の台, points: [[2.2, -1.9], [2.9, -1.9], [2.9, -1.2]], height: 0.25}
  - {type: box, name: 床のテープ, x: -2.4, y: -1.5, size_x: 0.6, size_y: 0.05, height: 0.002}
