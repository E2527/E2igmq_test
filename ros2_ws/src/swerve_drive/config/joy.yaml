# ゲームパッドで /cmd_vel を出す設定(teleop_twist_joy)
#
#   左スティック  … 前後・左右に移動(全方向)
#   右スティック  … その場で回転(左右)
#   LB を押している間だけ動く(安全のため)。RB も押すと速くなる(ターボ)
#
# 番号はゲームパッドによって違うことがある。`ros2 topic echo /joy` でスティックやボタンを動かして、
# 変わる番号を確かめて合わせる(下は Xbox 系を ROS 2 の joy で使ったときの番号)。
teleop_twist_joy_node:
  ros__parameters:
    require_enable_button: true
    enable_button: 9            # LB
    enable_turbo_button: 10     # RB
    axis_linear:
      x: 1                      # 左スティック 上下 → 前後
      y: 0                      # 左スティック 左右 → 左右
    scale_linear:
      x: 0.5                    # [m/s]
      y: 0.5
    scale_linear_turbo:
      x: 1.5
      y: 1.5
    axis_angular:
      yaw: 2                    # 右スティック 左右 → 回転
    scale_angular:
      yaw: 1.5                  # [rad/s]
    scale_angular_turbo:
      yaw: 3.0

joy_node:
  ros__parameters:
    deadzone: 0.1               # スティックの中心付近の小さなずれは 0 にする
    autorepeat_rate: 20.0       # スティックを動かさなくても 20 Hz で送り続ける(cmd_vel が途切れないように)
