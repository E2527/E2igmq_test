# スワーブの足回りの設定。ロボットに合わせて書き換える(単位は m、rad、rad/s)
#
#   上から見た図(x が前、y が左):
#
#          前(+x)
#     front_left ── front_right
#         |    base_link   |       ← ロボットの中心
#     rear_left  ── rear_right
#
#   モジュールの数は、下の 4 つの並び(module_names / device_ids / module_x / module_y)の長さで決まる。
#   4 つの数をそろえれば 2 個以上なら何個でもよい(設定画面 drive_setup で選ぶと簡単)
#
swerve_drive:
  ros__parameters:
    module_names: [front_left, front_right, rear_left, rear_right]
    device_ids:   [1, 2, 3, 4]              # 各モジュールの STM32 の ID(stm<ID>/command)
    module_x:     [0.25, 0.25, -0.25, -0.25]  # 中心から前に何 m(後ろはマイナス)
    module_y:     [0.25, -0.25, 0.25, -0.25]  # 中心から左に何 m(右はマイナス)
    wheel_radius: 0.05                      # タイヤの半径 [m]
    # タイヤの速さの上限 [rad/s]。STM32 が出せる速さ以下にする:
    #   app_config.h の APP_SWERVE_MAX_MOTOR_SPEED × APP_SWERVE_WHEEL_RATIO(今は 25 × 0.5 = 12.5)
    #   (12 rad/s × 0.05 m = 0.6 m/s。超えると、全部のモジュールを同じ割合で遅くする)
    max_wheel_speed: 12.0
    cosine_scale: false                     # 向きが合うまでタイヤを遅くする(STM32 の APP=swerve がやるので false)
    cmd_timeout_s: 0.5                      # cmd_vel がこれ以上来なければ止まる
    state_timeout_s: 0.5                    # モジュールの状態がこれ以上来なければオドメトリを止める
    rate_hz: 50.0                           # 指令を出す周期
    odom_frame: odom
    base_frame: base_link
    publish_tf: true                        # odom → base_link の TF を出す(robot_localization を使うときは false)

# 実機なしで試すときの、モジュールのふりをするノード
# (device_ids は、起動ファイルが上の swerve_drive の device_ids を渡すので、書かなくてよい)
fake_modules:
  ros__parameters:
    steer_speed: 6.0                        # 向きを変える最大の速さ [rad/s]
    wheel_time_constant: 0.1                # タイヤの速さが目標に近づく速さ [s]

# STM32 のファームウェアをそのまま動かすシミュレーション(firmware:=true のとき)
# ゲイン・ギア比・エンコーダは firmware/motor_node_f303k8/Core/Inc/app_config.h のものを使う
firmware_modules:
  ros__parameters:
    firmware_dir: /root/firmware            # リポジトリの firmware/(dev コンテナの中の場所)
    motor_no_load_speed: 0.0                # デューティ比 1.0 での速さ [rad/s](0 なら 1 / APP_KFF)
    motor_time_constant: 0.0                # モーターの速さが追いつく速さ [s](0 なら 0.05)
    mech_steer_ratio: 0.0                   # 本当の機構のギア比(0 なら app_config.h と同じ。
    mech_wheel_ratio: 0.0                   #   わざと違う値にすると、設定のまちがいを試せる)
