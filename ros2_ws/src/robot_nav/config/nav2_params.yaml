# Nav2(自動操縦)の設定。ロボットに合わせて書き換える(単位は m、rad、秒)
#
# まず直すところ(★):
#   robot_radius       … ロボットの半径(真上から見て、中心からいちばん遠い角まで)。3 か所ある
#   inflation_radius   … 壁からこれだけ離れた道を好む(robot_radius より十分大きく)。2 か所
#   vx_max / vy_max / wz_max … 自動操縦の速さの上限(足回りが出せる速さ以下に)
#
# しくみ(robot_nav の README に図あり):
#   amcl              … LiDAR の点と地図(/lidar_map)を重ねて、自分の位置を合わせる(TF の map → odom)
#   planner_server    … 地図の上で、ゴールまでの道を探す(A*)。道は /plan に出る
#   controller_server … 道に沿って走るように、速さを計算する(MPPI)。/cmd_vel_nav に出す
#   behavior_server   … 行き詰まったときの動き(その場で回る・少し下がる・待つ)
#   bt_navigator      … 上の部品を順番に呼ぶ司令塔(ゴールを受け取る: navigate_to_pose)

amcl:
  ros__parameters:
    robot_model_type: "nav2_amcl::OmniMotionModel"   # 横にも動ける足回り(スワーブ・オムニ)
    base_frame_id: "base_link"
    odom_frame_id: "odom"
    global_frame_id: "map"
    map_topic: /lidar_map           # LiDAR に映る物だけの地図(field_map が出す)
    scan_topic: scan
    tf_broadcast: true              # map → odom を出す(シミュレーションでは sim_world_node が出すのをやめる)
    transform_tolerance: 0.5
    # 最初の位置(コンソールの「位置を合わせる」か、シミュレーターが置き直すと変わる)
    set_initial_pose: true
    initial_pose: {x: 0.0, y: 0.0, z: 0.0, yaw: 0.0}
    # オドメトリのずれの大きさ(大きいほど、オドメトリを信じない)
    alpha1: 0.2
    alpha2: 0.2
    alpha3: 0.2
    alpha4: 0.2
    alpha5: 0.2
    laser_model_type: "likelihood_field"
    laser_max_range: 12.0
    laser_min_range: -1.0
    laser_likelihood_max_dist: 2.0
    max_beams: 60
    min_particles: 500
    max_particles: 2000
    update_min_d: 0.1               # これだけ動いたら位置を合わせ直す [m]
    update_min_a: 0.1               # [rad]
    resample_interval: 1
    pf_err: 0.05
    pf_z: 0.99
    # 位置を見失ったら、ばらばらの位置の候補を混ぜて探し直す(0 ならしない)
    recovery_alpha_fast: 0.1
    recovery_alpha_slow: 0.001
    sigma_hit: 0.2
    z_hit: 0.5
    z_max: 0.05
    z_rand: 0.5
    z_short: 0.05
    lambda_short: 0.1
    do_beamskip: false
    save_pose_rate: 0.5

# 止まっている間も、定期的に AMCL に位置を直させる(robot_nav の relocalize.py)
relocalize:
  ros__parameters:
    period_s: 3.0                   # 何秒ごとに直すか(0 でしない)
    still_speed: 0.02               # これより遅ければ、止まっているとみなす [m/s・rad/s]

bt_navigator:
  ros__parameters:
    global_frame: map
    robot_base_frame: base_link
    odom_topic: /odom
    bt_loop_duration: 10
    default_server_timeout: 20
    wait_for_service_timeout: 1000
    navigators: ["navigate_to_pose", "navigate_through_poses"]
    navigate_to_pose:
      plugin: "nav2_bt_navigator::NavigateToPoseNavigator"
    navigate_through_poses:
      plugin: "nav2_bt_navigator::NavigateThroughPosesNavigator"
    # 行動の手順(ビヘイビアツリー)は Nav2 の標準のもの:
    #   1 秒ごとに道を探し直しながら道に沿って走り、だめなら地図を消し直す・回る・待つ・下がる
    error_code_names:
      - compute_path_error_code
      - follow_path_error_code

controller_server:
  ros__parameters:
    controller_frequency: 20.0
    costmap_update_timeout: 0.30
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.001     # 横にも動ける足回りなので、横の速さも使う
    min_theta_velocity_threshold: 0.001
    failure_tolerance: 0.3
    progress_checker_plugins: ["progress_checker"]
    goal_checker_plugins: ["general_goal_checker"]
    # 道に沿って走る部品を 2 つ用意して、ロボットコンソールが選ぶ(controller_selector のトピック)
    #   FollowPath        … ゴールの近く(0.5 m 以内)まで向きを変えない(「着いてから回る」でも使う)
    #   FollowPathTurning … ゴールの 2 m 手前から、走りながらゴールの向きに回る(「走りながら回る」)
    controller_plugins: ["FollowPath", "FollowPathTurning"]

    # 10 秒たっても 0.3 m 進まなければ、行き詰まったとみなす
    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      required_movement_radius: 0.3
      movement_time_allowance: 10.0
    # ゴールにこれだけ近づいたら「着いた」
    general_goal_checker:
      plugin: "nav2_controller::SimpleGoalChecker"
      stateful: true
      xy_goal_tolerance: 0.1        # [m]。小さすぎると、AMCL が位置を数 cm 直すたびに、ゴールのまわりでうろうろする
      yaw_goal_tolerance: 0.1       # [rad](約 6°)

    # MPPI: 少しずつ違う速さで動いたときの動きを、たくさん(2000 通り)試して、いちばん良いものを選ぶ
    # GoalCritic / PathFollowCritic / CostCritic の「ゴールの近く」は、道のりではなく、ゴールまでのまっすぐの
    # 距離で決まる。経由地点を通る道は途中でゴールの近くを通ることがあるので、小さくしておく(大きいと、
    # 経由地点を無視してゴールに直接向かおうとして、障害物の手前で止まる)
    FollowPath:
      plugin: "nav2_mppi_controller::MPPIController"
      motion_model: "Omni"          # 横にも動ける
      time_steps: 56
      model_dt: 0.05
      batch_size: 2000
      iteration_count: 1
      vx_max: 0.5                   # ★ 前の速さの上限 [m/s]
      vx_min: -0.5                  # 後ろの速さの上限 [m/s](マイナス)
      vy_max: 0.5                   # ★ 横の速さの上限 [m/s]
      wz_max: 1.5                   # ★ 回る速さの上限 [rad/s]
      ax_max: 2.0
      ax_min: -2.0
      ay_max: 2.0
      ay_min: -2.0
      az_max: 3.0
      vx_std: 0.2
      vy_std: 0.2
      wz_std: 0.4
      prune_distance: 1.7
      transform_tolerance: 0.1
      temperature: 0.3
      gamma: 0.015
      visualize: false
      regenerate_noises: true
      critics: [
        "ConstraintCritic", "CostCritic", "GoalCritic", "GoalAngleCritic",
        "PathAlignCritic", "PathFollowCritic", "TwirlingCritic"]
      ConstraintCritic:
        enabled: true
        cost_power: 1
        cost_weight: 4.0
      GoalCritic:
        enabled: true
        cost_power: 1
        cost_weight: 5.0
        threshold_to_consider: 0.6  # [m] ゴールまでのまっすぐの距離がこれ以下で、道に沿うのをやめてゴールに直接向かう
      GoalAngleCritic:
        enabled: true
        cost_power: 1
        cost_weight: 3.0
        threshold_to_consider: 0.5
      CostCritic:
        enabled: true
        cost_power: 1
        cost_weight: 3.81
        near_collision_cost: 253
        critical_cost: 300.0
        consider_footprint: false
        collision_cost: 1000000.0
        near_goal_distance: 0.5    # [m] ゴールのこの距離以内では、障害物のそばも通る
        trajectory_point_step: 2
      PathAlignCritic:
        enabled: true
        cost_power: 1
        cost_weight: 14.0
        max_path_occupancy_ratio: 0.05
        trajectory_point_step: 4
        threshold_to_consider: 0.5
        offset_from_furthest: 20
        use_path_orientations: false
      PathFollowCritic:
        enabled: true
        cost_power: 1
        cost_weight: 5.0
        offset_from_furthest: 5
        threshold_to_consider: 0.6  # [m] GoalCritic と同じに
      TwirlingCritic:               # 走りながら、むだにくるくる回らないように
        enabled: true
        twirling_cost_power: 1
        twirling_cost_weight: 10.0

    # 走りながら回る: 上の FollowPath と同じで、ゴールの 2 m 手前から向きを気にする(★ の値もそろえる)
    # Nav2 が探した道の途中の点には向きが入っていない(全部 0°)ので、ゴールが MPPI の見ている範囲
    # (prune_distance と、ローカルのコストマップの中)に入ってから回り始める。もっと遠くから回らせると、
    # 途中の点の 0° に向こうとして、変な動きになる
    FollowPathTurning:
      plugin: "nav2_mppi_controller::MPPIController"
      motion_model: "Omni"          # 横にも動ける
      time_steps: 56
      model_dt: 0.05
      batch_size: 2000
      iteration_count: 1
      vx_max: 0.5                   # ★ 前の速さの上限 [m/s]
      vx_min: -0.5                  # 後ろの速さの上限 [m/s](マイナス)
      vy_max: 0.5                   # ★ 横の速さの上限 [m/s]
      wz_max: 1.5                   # ★ 回る速さの上限 [rad/s]
      ax_max: 2.0
      ax_min: -2.0
      ay_max: 2.0
      ay_min: -2.0
      az_max: 3.0
      vx_std: 0.2
      vy_std: 0.2
      wz_std: 0.4
      prune_distance: 3.0           # 道をこれだけ先まで見る [m](threshold_to_consider より長く)
      transform_tolerance: 0.1
      temperature: 0.3
      gamma: 0.015
      visualize: false
      regenerate_noises: true
      critics: [
        "ConstraintCritic", "CostCritic", "GoalCritic", "GoalAngleCritic",
        "PathAlignCritic", "PathFollowCritic"]
      ConstraintCritic:
        enabled: true
        cost_power: 1
        cost_weight: 4.0
      GoalCritic:
        enabled: true
        cost_power: 1
        cost_weight: 5.0
        threshold_to_consider: 0.6  # [m] ゴールまでのまっすぐの距離がこれ以下で、道に沿うのをやめてゴールに直接向かう
      GoalAngleCritic:              # ゴールまでこれだけの距離に来たら、ゴールの向きに近づける
        enabled: true
        cost_power: 1
        cost_weight: 3.0
        threshold_to_consider: 2.0  # [m]。ローカルのコストマップの半分(2.5 m)より小さく
      CostCritic:
        enabled: true
        cost_power: 1
        cost_weight: 3.81
        near_collision_cost: 253
        critical_cost: 300.0
        consider_footprint: false
        collision_cost: 1000000.0
        near_goal_distance: 0.5    # [m] ゴールのこの距離以内では、障害物のそばも通る
        trajectory_point_step: 2
      PathAlignCritic:
        enabled: true
        cost_power: 1
        cost_weight: 14.0
        max_path_occupancy_ratio: 0.05
        trajectory_point_step: 4
        threshold_to_consider: 0.5
        offset_from_furthest: 20
        use_path_orientations: false
      PathFollowCritic:
        enabled: true
        cost_power: 1
        cost_weight: 5.0
        offset_from_furthest: 5
        threshold_to_consider: 0.6  # [m] GoalCritic と同じに

# コストマップ: 地図の壁を、ロボットの半径だけ太らせて塗ったもの。道はここで探す
#   static_layer    … フィールドの地図(/map。通れるか用。LiDAR に映らない低い物も入っている)
#   obstacle_layer  … LiDAR で見えた、地図にない物(シミュレーターで置いた障害物など)
#   inflation_layer … 壁のまわりを太らせる
local_costmap:
  local_costmap:
    ros__parameters:
      update_frequency: 5.0
      publish_frequency: 2.0
      global_frame: odom
      robot_base_frame: base_link
      rolling_window: true          # ロボットのまわり 5 m × 5 m だけ
      width: 5
      height: 5
      resolution: 0.05
      robot_radius: 0.35            # ★
      plugins: ["static_layer", "obstacle_layer", "inflation_layer"]
      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_topic: /map
        map_subscribe_transient_local: true
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: true
        observation_sources: scan
        scan:
          topic: /scan
          data_type: "LaserScan"
          marking: true
          clearing: true
          min_obstacle_height: -1.0
          max_obstacle_height: 2.0
          obstacle_max_range: 3.0
          obstacle_min_range: 0.0
          raytrace_max_range: 4.0
          raytrace_min_range: 0.0
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        # 壁から遠いほど通りやすくする範囲と、その減り方。範囲を広く・減り方をゆるくすると、
        # 道が障害物のすぐ横ではなく、すき間のまん中を通るようになり、自動操縦が安定する
        cost_scaling_factor: 3.0
        inflation_radius: 0.8       # ★
      always_send_full_costmap: true

global_costmap:
  global_costmap:
    ros__parameters:
      update_frequency: 1.0
      publish_frequency: 1.0
      global_frame: map
      robot_base_frame: base_link
      robot_radius: 0.35            # ★
      resolution: 0.05
      track_unknown_space: false
      plugins: ["static_layer", "obstacle_layer", "inflation_layer"]
      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_topic: /map
        map_subscribe_transient_local: true
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: true
        observation_sources: scan
        scan:
          topic: /scan
          data_type: "LaserScan"
          marking: true
          clearing: true
          min_obstacle_height: -1.0
          max_obstacle_height: 2.0
          obstacle_max_range: 3.0
          obstacle_min_range: 0.0
          raytrace_max_range: 4.0
          raytrace_min_range: 0.0
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        # 壁から遠いほど通りやすくする範囲と、その減り方。範囲を広く・減り方をゆるくすると、
        # 道が障害物のすぐ横ではなく、すき間のまん中を通るようになり、自動操縦が安定する
        cost_scaling_factor: 3.0
        inflation_radius: 0.8       # ★
      always_send_full_costmap: true

planner_server:
  ros__parameters:
    expected_planner_frequency: 20.0
    planner_plugins: ["GridBased"]
    costmap_update_timeout: 1.0
    GridBased:
      plugin: "nav2_navfn_planner::NavfnPlanner"
      use_astar: true               # A*(ゴールに近い方から先に調べる探し方)
      tolerance: 0.2                # ゴールがふさがっていたら、これだけ近くまでで良い [m]
      allow_unknown: false

behavior_server:
  ros__parameters:
    local_costmap_topic: local_costmap/costmap_raw
    global_costmap_topic: global_costmap/costmap_raw
    local_footprint_topic: local_costmap/published_footprint
    global_footprint_topic: global_costmap/published_footprint
    cycle_frequency: 10.0
    behavior_plugins: ["spin", "backup", "drive_on_heading", "wait"]
    spin:
      plugin: "nav2_behaviors::Spin"
    backup:
      plugin: "nav2_behaviors::BackUp"
    drive_on_heading:
      plugin: "nav2_behaviors::DriveOnHeading"
    wait:
      plugin: "nav2_behaviors::Wait"
    local_frame: odom
    global_frame: map
    robot_base_frame: base_link
    transform_tolerance: 0.1
    simulate_ahead_time: 2.0
    max_rotational_vel: 1.0
    min_rotational_vel: 0.4
    rotational_acc_lim: 3.2
