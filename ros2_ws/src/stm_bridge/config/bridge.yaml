# stm_bridge の設定。ロボットに合わせて書き換える
stm_bridge:
  ros__parameters:
    can_interface: can0         # Pi の CAN(実機なしで fake_stm と試すときは sim)
    device_ids: [1]             # バスにつながっている STM32 の ID(1〜255)
    rate_hz: 100.0              # 指令を送る周期。STM32 側の見張り時間(100 ms)より十分短くする
    command_timeout_s: 0.5      # stm<ID>/command がこれ以上来なければ空の指令(= 停止)を送る
    state_timeout_s: 0.5        # STM32 から状態がこれ以上届かなければ警告する
