# 使い方は README.md を参照
#
# PC と Pi で ROS 2 の通信をするときは、両方のリポジトリの一番上に .env を作り、同じ番号にする
# (大会などで、ほかのチームのロボットと混ざらないように 0 以外の番号にする)
#   ROS_DOMAIN_ID=42
#   ROS_STATIC_PEERS=192.168.0.10   # Wi-Fi でマルチキャストが届かないときだけ。相手の IP アドレス

x-ros-network: &ros-network
  ROS_DOMAIN_ID: ${ROS_DOMAIN_ID:-0}
  ROS_STATIC_PEERS: ${ROS_STATIC_PEERS:-}

services:
  # 開発用コンテナ。ros2_ws をマウントしてコンテナ内で colcon build する
  dev:
    build:
      context: .
      dockerfile: docker/Dockerfile
      target: dev
    image: robocon/ros2:jazzy-dev
    container_name: ros_dev
    restart: unless-stopped # WSL や PC を再起動しても自動で起動する(docker stop で止めたときは起動しない)
    network_mode: host      # ROS 2 の DDS 通信をホストと共有
    ipc: host
    stdin_open: true
    tty: true
    volumes:
      - ./ros2_ws:/root/ros2_ws
      - ./firmware:/root/firmware       # STM32 のコードを make -C /root/firmware/stm32_can/test でテストする
      - ./config:/root/config:ro
      - /tmp/.X11-unix:/tmp/.X11-unix   # rviz2 などの GUI 表示(WSLg と Linux の X11 / Xwayland)
      - /mnt/wslg:/mnt/wslg             # WSLg 用(WSL 以外では空のフォルダになるだけ)
      - /dev:/dev                       # USB シリアル(/dev/ttyACM0 など)を、挿し直してもコンテナから使えるようにする
    device_cgroup_rules:
      - "c 166:* rmw"                   # /dev/ttyACM*(Nucleo の ST-LINK など)
      - "c 188:* rmw"                   # /dev/ttyUSB*(USB シリアル変換)
      - "c 189:* rmw"                   # /dev/bus/usb(make flash で ST-LINK に書き込む)
      - "c 226:* rmw"                   # /dev/dri(Linux で rviz2 を GPU で描く)
      - "c 13:* rmw"                    # /dev/input(ゲームパッド。swerve_drive の joy:=true)
    security_opt:
      - label=disable                   # Fedora などの SELinux で、マウントしたフォルダや /dev が拒否されないようにする
    environment:
      <<: *ros-network
      DISPLAY: ${DISPLAY:-:0}
      WAYLAND_DISPLAY: ${WAYLAND_DISPLAY:-wayland-0}
      XDG_RUNTIME_DIR: /mnt/wslg/runtime-dir
      PULSE_SERVER: /mnt/wslg/PulseServer

  # ビルドだけ実行して終了する(CI や確認用)
  build:
    extends: dev
    container_name: ros_build
    restart: "no"           # 終わったら止まったままにする(dev の restart を引き継がない)
    command: >
      bash -c "colcon build --symlink-install && colcon test && colcon test-result --verbose"

  # 実機(Pi 5 / Pi 400)用: ビルド済みの軽量イメージ(GUI・コンパイラなし、ubuntu ユーザーで動く)
  runtime:
    build:
      context: .
      dockerfile: docker/Dockerfile.pi
      target: runtime
    image: robocon/ros2:jazzy
    network_mode: host
    ipc: host
    environment: *ros-network
    profiles: ["robot"]

  # 足回り一式(swerve_node + stm_bridge)。Pi で起動し、PC から Wi-Fi で操縦する
  #   docker compose --profile robot up -d drive
  #   USB シリアルなら: STM_INTERFACE=serial:/dev/ttyACM0 docker compose --profile robot up -d drive
  # PC では teleop.launch.py(ゲームパッド + rviz2)を起動する(ros2_ws/src/swerve_drive/README.md)
  drive:
    image: robocon/ros2:jazzy
    network_mode: host
    ipc: host
    restart: unless-stopped
    command: ros2 launch swerve_drive swerve.launch.py
    environment:
      <<: *ros-network
      STM_INTERFACE: ${STM_INTERFACE:-}         # 空なら bridge.yaml の can_interface(can0)
    volumes:
      - /dev:/dev
    device_cgroup_rules:
      - "c 166:* rmw"                           # /dev/ttyACM*
      - "c 188:* rmw"                           # /dev/ttyUSB*
    group_add:
      - dialout                                 # ubuntu ユーザーでシリアルポートを開けるように
    profiles: ["robot"]

  # STM32 と ROS 2 トピックを中継するだけ(STM32 1 枚の動作確認用。足回りは上の drive が自分で起動する)
  #   CAN:        can0 を Pi 側で up にしておく(docker/pi/80-can.network)。network_mode: host なのでそのまま見える
  #   USB シリアル: STM_INTERFACE=serial:/dev/ttyACM0 docker compose --profile bridge up -d
  # そのほかの設定は ros2_ws/src/stm_bridge/config/bridge.yaml(変えたらイメージを作り直す)
  stm-bridge:
    image: robocon/ros2:jazzy
    network_mode: host
    ipc: host
    restart: unless-stopped
    command: ros2 launch stm_bridge bridge.launch.py
    environment:
      <<: *ros-network
      STM_INTERFACE: ${STM_INTERFACE:-}         # 空なら bridge.yaml の can_interface(can0)
    volumes:
      - /dev:/dev                               # USB を挿し直しても見えるように
    device_cgroup_rules:
      - "c 166:* rmw"                           # /dev/ttyACM*
      - "c 188:* rmw"                           # /dev/ttyUSB*
    group_add:
      - dialout                                 # ubuntu ユーザーでシリアルポートを開けるように
    profiles: ["bridge"]   # drive と同時に起動すると、同じ STM32 を取り合う

  # STM32 と USB シリアルでつなぐ micro-ROS agent(今は stm_bridge を使うので、普段は起動しない)
  # stm-bridge と同じ /dev/ttyACM0 を取り合うので、使うときは --profile micro-ros で別に起動する
  micro-ros-agent:
    image: microros/micro-ros-agent:jazzy
    network_mode: host
    restart: unless-stopped
    devices:
      - ${STM32_DEVICE:-/dev/ttyACM0}:/dev/stm32
    command: serial --dev /dev/stm32 -b 115200
    profiles: ["micro-ros"]
